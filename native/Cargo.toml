[package]
name = "omarchy-dictate"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "omarchy-dictate"
path = "src/main.rs"

[dependencies]
whisper-rs = "0.16"
sha2 = "0.10"
libc = "0.2"
# Pure Rust D-Bus for `caret` (fcitx5's kimpanel protocol); nothing at runtime.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde_json = "1"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
